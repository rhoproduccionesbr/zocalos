<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zócalo OBS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fondo transparente - pantalla completa para OBS */
        html,
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        /* Zócalo fijo en la parte inferior central */
        .zocalo {
            position: fixed;
            bottom: 100px;
            /* margen desde el borde inferior */
            left: 50%;
            transform: translateX(-50%);
            /* centrado horizontal */
            width: 900px;
            max-width: 100%;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cada imagen */
        .slide {
            position: absolute;
            max-width: 100%;
            max-height: 130px;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0;
            transform: translateY(12px) scale(0.97);
            transition:
                opacity 0.7s ease,
                transform 0.7s ease;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    </style>
</head>

<body>

    <div class="zocalo" id="zocalo">
        <!-- Las imágenes se inyectan dinámicamente -->
    </div>

    <script>
        // Lista de imágenes (todos los archivos PNG de la carpeta)
        const imagenes = [
            "El profe.png",
            "Manuel  enciso.png",
            "abog carlos centurion.png",
            "amadito.png",
            "gringos.png",
            "bodega packo.png",
            "clinica  san  francisco.png",
            "hector ramos2.png",
            "hernan martinez.png",
            "herreria  sandoval.png",
            "imprecor.png",
            "julio gamarra.png",
            "laura acosta.png",
            "libreria gonza.png",
            "reybeinitez.png",
            "ricardo  arroyo.png",
            "rolo  nuñez.png",
            "terere el gordo.png",
            "zonia  boutique.png"
        ];

        const zocalo = document.getElementById('zocalo');
        let indiceActual = -1;
        let slides = [];

        // Crear elementos <img> para cada imagen
        imagenes.forEach((src, i) => {
            const img = document.createElement('img');
            img.src = encodeURIComponent(src).replace(/%20/g, '%20').replace(/%20%20/g, '%20%20');
            img.src = src; // nombre con espacios funciona localmente
            img.className = 'slide';
            img.alt = src;
            zocalo.appendChild(img);
            slides.push(img);
        });

        // Mezclar array aleatoriamente (Fisher-Yates)
        function mezclar(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        let orden = mezclar([...Array(imagenes.length).keys()]);
        let posicion = 0;

        function mostrarSiguiente() {
            // Ocultar actual
            if (indiceActual >= 0) {
                slides[indiceActual].classList.remove('active', 'enter');
            }

            // Pasar al siguiente del orden aleatorio
            if (posicion >= orden.length) {
                orden = mezclar([...Array(imagenes.length).keys()]);
                posicion = 0;
            }

            indiceActual = orden[posicion];
            posicion++;

            const slide = slides[indiceActual];
            slide.classList.add('active', 'enter');

            // Remover clase "enter" después de que termine la animación
            slide.addEventListener('animationend', () => {
                slide.classList.remove('enter');
            }, { once: true });
        }

        // Mostrar primera imagen inmediatamente
        mostrarSiguiente();

        // Cambiar imagen cada 5 segundos
        setInterval(mostrarSiguiente, 5000);
    </script>

</body>


</html>
